<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4EF;
    --face: #FCFBF8;
    --ink: #26241E;
    --ink-soft: #706C61;
    --tick: #D9D4C7;
    --tick-major: #A29B8B;
    --accent: #6E8F72;
    --accent-ink: #FBFAF6;
    --ring-shadow: rgba(38, 36, 30, 0.08);
    --btn-border: #D9D4C7;
  }

  html[data-theme="dark"] {
    --bg: #131513;
    --face: #191b19;
    --ink: #EDEAE2;
    --ink-soft: #8E8B82;
    --tick: #333630;
    --tick-major: #56594F;
    --accent: #86AB89;
    --accent-ink: #10120F;
    --ring-shadow: rgba(0, 0, 0, 0.4);
    --btn-border: #333630;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    transition: background 0.4s ease, color 0.4s ease;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.6rem clamp(1.2rem, 4vw, 2.4rem);
  }

  .brand {
    font-family: "Fraunces", serif;
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .controls {
    display: flex;
    gap: 0.6rem;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: var(--face);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .icon-btn:hover { border-color: var(--tick-major); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  html[data-theme="dark"] .sun { display: block; }
  html[data-theme="dark"] .moon { display: none; }
  html:not([data-theme="dark"]) .sun { display: none; }
  html:not([data-theme="dark"]) .moon { display: block; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.6rem;
    padding: 1rem 1.5rem 3rem;
  }

  .clock-face {
    position: relative;
    width: min(66vmin, 440px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--face);
    box-shadow: 0 1px 0 var(--ring-shadow), 0 30px 60px -30px var(--ring-shadow);
  }

  .clock-face::before,
  .clock-face::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }

  .clock-face::before {
    background: repeating-conic-gradient(var(--tick) 0deg 0.6deg, transparent 0.6deg 6deg);
    -webkit-mask-image: radial-gradient(circle, transparent 84%, black 85%, black 93%, transparent 94%);
            mask-image: radial-gradient(circle, transparent 84%, black 85%, black 93%, transparent 94%);
  }

  .clock-face::after {
    background: repeating-conic-gradient(var(--tick-major) 0deg 1.3deg, transparent 1.3deg 30deg);
    -webkit-mask-image: radial-gradient(circle, transparent 78%, black 79%, black 93%, transparent 94%);
            mask-image: radial-gradient(circle, transparent 78%, black 79%, black 93%, transparent 94%);
  }

  .quarter-mark {
    position: absolute;
    background: var(--tick-major);
    border-radius: 3px;
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }

  .quarter-mark[data-q="1"] { top: 3.5%; left: 50%; width: 5px; height: 9%; transform: translateX(-50%); }
  .quarter-mark[data-q="2"] { top: 50%; right: 3.5%; width: 9%; height: 5px; transform: translateY(-50%); }
  .quarter-mark[data-q="3"] { bottom: 3.5%; left: 50%; width: 5px; height: 9%; transform: translateX(-50%); }
  .quarter-mark[data-q="4"] { top: 50%; left: 3.5%; width: 9%; height: 5px; transform: translateY(-50%); }

  .quarter-mark.lit {
    background: var(--accent);
    box-shadow: 0 0 14px 1px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  .hand {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 3px;
    height: 37%;
    background: var(--ink);
    border-radius: 3px 3px 0 0;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(0deg);
    transition: background 0.4s ease, transform 0.9s linear;
  }

  .hand--minute {
    width: 2px;
    height: 27%;
    background: var(--accent);
    opacity: 0.85;
  }

  .hand--second {
    width: 1.3px;
    height: 44%;
    background: var(--tick-major);
    opacity: 0.9;
    transition: none;
    animation: spin-second 60s linear infinite;
    animation-play-state: paused;
  }

  .clock-face.running .hand--second {
    animation-play-state: running;
  }

  @keyframes spin-second {
    from { transform: translate(-50%, -100%) rotate(0deg); }
    to   { transform: translate(-50%, -100%) rotate(360deg); }
  }

  .main-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 32%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid var(--btn-border);
    background: var(--face);
    color: var(--ink);
    font-family: "Fraunces", serif;
    font-size: clamp(0.95rem, 2.1vmin, 1.15rem);
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease, color 0.2s ease;
  }

  .main-btn:hover { border-color: var(--accent); color: var(--accent); }
  .main-btn:active { transform: translate(-50%, -50%) scale(0.96); }

  .status {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
    letter-spacing: 0.01em;
    text-align: center;
    min-height: 1.2em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <span class="brand">M</span>
  <div class="controls">
    <button class="icon-btn" id="testSoundBtn" aria-label="Test sound" title="Test sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13.2A9 9 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2Z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="clock-face" id="clockFace">
    <div class="quarter-mark" data-q="1"></div>
    <div class="quarter-mark" data-q="2"></div>
    <div class="quarter-mark" data-q="3"></div>
    <div class="quarter-mark" data-q="4"></div>
    <div class="hand hand--minute" id="minuteHand"></div>
    <div class="hand hand--second" id="secondHand"></div>
    <div class="hand" id="hand"></div>
    <button class="main-btn" id="mainBtn">Start</button>
  </div>
  <p class="status" id="statusText"></p>
</main>

<script>
(function () {
  const SESSION_MS = 60 * 60 * 1000;
  const INTERVAL_MS = 15 * 60 * 1000;
  const STORAGE_KEY = "m-clock-start";
  const THEME_KEY = "m-theme";

  const clockFace = document.getElementById("clockFace");
  const hand = document.getElementById("hand");
  const minuteHand = document.getElementById("minuteHand");
  const secondHand = document.getElementById("secondHand");
  const mainBtn = document.getElementById("mainBtn");
  const statusText = document.getElementById("statusText");
  const themeBtn = document.getElementById("themeBtn");
  const testSoundBtn = document.getElementById("testSoundBtn");
  const quarterMarks = Array.from(document.querySelectorAll(".quarter-mark"));

  let audioCtx = null;
  let timers = [];
  let tickInterval = null;

  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
  }
  const savedTheme = localStorage.getItem(THEME_KEY) ||
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(savedTheme);

  themeBtn.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    localStorage.setItem(THEME_KEY, next);
  });

  // ---------- Sound ----------
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function playChime() {
    ensureAudio();
    const ctx = audioCtx;
    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.25, now + 0.06);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 3.4);
    master.connect(ctx.destination);

    [528, 792].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.value = i === 0 ? 1 : 0.32;
      osc.connect(g);
      g.connect(master);
      osc.start(now);
      osc.stop(now + 3.5);
    });
  }

  testSoundBtn.addEventListener("click", playChime);

  // ---------- Clock rendering ----------
  function setHandDeg(deg) {
    hand.style.transform = `translate(-50%, -100%) rotate(${deg}deg)`;
  }

  function setMinuteHandDeg(deg) {
    minuteHand.style.transform = `translate(-50%, -100%) rotate(${deg}deg)`;
  }

  function setInstant(el, deg) {
    const prev = el.style.transition;
    el.style.transition = "none";
    el.style.transform = `translate(-50%, -100%) rotate(${deg}deg)`;
    el.offsetHeight; // force reflow
    el.style.transition = prev;
  }

  function lightQuarter(q) {
    const el = quarterMarks.find(m => m.dataset.q === String(q));
    if (el) el.classList.add("lit");
  }

  function unlightAllQuarters() {
    quarterMarks.forEach(m => m.classList.remove("lit"));
  }

  function clearTimers() {
    timers.forEach(t => clearTimeout(t));
    timers = [];
    if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
  }

  // ---------- States ----------
  function goIdle(clearStorage) {
    clearTimers();
    if (clearStorage) localStorage.removeItem(STORAGE_KEY);
    unlightAllQuarters();
    setInstant(hand, 0);
    setInstant(minuteHand, 0);
    clockFace.classList.remove("running");
    secondHand.style.animationDelay = "0s";
    mainBtn.textContent = "Start";
    statusText.textContent = "";
  }

  function goDone() {
    clearTimers();
    setInstant(hand, 360);
    setInstant(minuteHand, 0);
    clockFace.classList.remove("running");
    for (let q = 1; q <= 4; q++) lightQuarter(q);
    mainBtn.textContent = "Reset";
    statusText.textContent = "Session complete.";
  }

  function goRunning(startTime) {
    clearTimers();
    mainBtn.textContent = "Reset";

    const elapsedSeconds = (Date.now() - startTime) / 1000;
    secondHand.style.animationDelay = `-${elapsedSeconds % 60}s`;
    clockFace.classList.add("running");

    function frame(instant) {
      const elapsed = Date.now() - startTime;
      if (elapsed >= SESSION_MS) {
        goDone();
        return;
      }
      const handDeg = (elapsed / SESSION_MS) * 360;
      const minuteDeg = (elapsed / 60000) * 360;
      if (instant) {
        setInstant(hand, handDeg);
        setInstant(minuteHand, minuteDeg);
      } else {
        setHandDeg(handDeg);
        setMinuteHandDeg(minuteDeg);
      }
    }
    frame(true);
    tickInterval = setInterval(frame, 1000);

    statusText.textContent = "Listening for the next chime…";

    const alreadyPassed = Math.min(4, Math.floor((Date.now() - startTime) / INTERVAL_MS));
    for (let q = 1; q <= alreadyPassed; q++) lightQuarter(q);

    for (let q = alreadyPassed + 1; q <= 4; q++) {
      const delay = q * INTERVAL_MS - (Date.now() - startTime);
      const t = setTimeout(() => {
        lightQuarter(q);
        playChime();
        if (q === 4) goDone();
      }, Math.max(0, delay));
      timers.push(t);
    }
  }

  // ---------- Init from storage ----------
  function init() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) {
      goIdle(false);
      return;
    }
    const startTime = parseInt(stored, 10);
    const elapsed = Date.now() - startTime;
    if (elapsed >= SESSION_MS) {
      goDone();
    } else {
      goRunning(startTime);
    }
  }

  // ---------- Main button ----------
  mainBtn.addEventListener("click", () => {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!stored) {
      ensureAudio();
      const startTime = Date.now();
      localStorage.setItem(STORAGE_KEY, String(startTime));
      unlightAllQuarters();
      goRunning(startTime);
    } else {
      goIdle(true);
    }
  });

  init();
})();
</script>

</body>
</html>
